aid: dynamic
name: Dynamic
description: >-
  Dynamic is a wallet infrastructure platform for fintech, crypto, and
  stablecoin applications, letting companies embed non-custodial wallets,
  connect 800+ external wallets, run distributed (TSS-MPC) key management, and
  build onchain products such as crypto payments, trading, yield, and global
  money movement without in-house crypto expertise. Developers integrate through
  a full stack that ranges from low-level REST APIs to prebuilt UI SDKs for
  React, JavaScript, React Native, Flutter, Swift, Kotlin, Unity, and
  server-side Node, Python, Rust, and Java, plus a `dyn` CLI, an official
  documentation MCP server, and webhooks for environment events. The REST API is
  organized into admin and SDK endpoints for environments, users, wallets,
  sessions, MFA, gates, and Wallet-as-a-Service (WaaS). Dynamic was backed by
  a16z and was acquired by Fireblocks in October 2025.
